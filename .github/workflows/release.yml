name: Release

# 目前只能手動執行，推 tag 不會自動觸發（平常用 `npm run release:local` 在本機發佈）。
# 手動執行：Actions 分頁 → Release → Run workflow，並在「Use workflow from」選要發佈的 tag。
# 要恢復推 tag 自動發佈時，把下面的 workflow_dispatch 換成註解裡的設定。
#
# Obsidian 會從「tag 與 manifest.json 的 version 完全相同」的 GitHub Release 下載外掛，
# 所以 tag 不加 v，例如 1.2.0。
on:
  workflow_dispatch:
  # push:
  #   tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 確認 tag 與版本號一致
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::目前的 ref 是 $TAG，與 package.json 的版本 $version 不一致。請在 tag $version 上執行。"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 產生建置來源證明
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: 建立 GitHub Release（已存在就更新檔案）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/main.js dist/manifest.json dist/styles.css --clobber
          else
            gh release create "$TAG" \
              dist/main.js dist/manifest.json dist/styles.css \
              --title "$TAG" \
              --generate-notes
          fi
